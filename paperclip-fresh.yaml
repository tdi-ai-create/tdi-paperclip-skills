# ============================================================================
# TDI Paperclip -- Fresh Instance Config
# Created: July 16, 2026
#
# Changes from old instance:
#   - Erin Pope REMOVED (dead agent, was poisoning escalation system)
#   - Jim Ford REMOVED (human, does phone outreach outside Paperclip)
#   - Priya Nair REMOVED (merged into Nora's scope)
#   - Nora Reeves ADDED (was missing from old YAML, added via UI)
#   - Assignment-driven agents have heartbeat DISABLED (Izzy, Julie Lynn,
#     Jasmine, Anne Marie, Simone, Lily, Amara, Sophia)
#   - Org-chart-only agents (Mel, Sandra, Victor) kept as placeholders
#   - Dominic Osei, Dr. David Chen deferred to Phase 2
#   - James Washington deferred to Phase 2
#   - Agent Health Monitor removed (was custom script, needs rebuild)
#   - GSV outreach routine removed (expired April 2026)
#   - GHL sync routine kept but reduced frequency (Kristin email marketing)
#   - Paperclip version should be PINNED in package.json, not "latest"
#
# IMPORTANT: Set Nora Reeves as the default escalation/recovery target
# in the Paperclip UI after first boot. This is NOT configurable in YAML.
# ============================================================================

agents:

  # ── TIER 1: Core Operations (heartbeat agents) ──────────────────────────

  nora-reeves:
    role: "general"
    icon: "cog"
    capabilities: "Operations orchestrator -- agent health monitoring, handoff verification, blocked/stale task cleanup, partner health scoring, daily ops standup to Rae"
    adapter:
      config:
        dangerouslySkipPermissions: true
        maxTurnsPerRun: 100
        model: "claude-sonnet-4-6"
      type: "claude_local"
    runtime:
      heartbeat:
        cron: "0 8,12,16 * * 1-5"
        enabled: true
    budgetMonthlyCents: 3000

  olivia-smith:
    role: "general"
    icon: "mail"
    capabilities: "Executive communications, scheduling, stakeholder correspondence, daily/weekly briefings, approval batching, efficiency execution layer"
    adapter:
      config:
        dangerouslySkipPermissions: true
        maxTurnsPerRun: 50
        mcpServers:
          gmail:
            args:
              - "-y"
              - "@gongrzhe/server-gmail-autoauth-mcp"
            command: "npx"
            env:
              GOOGLE_CLIENT_ID: "$GOOGLE_OAUTH_CLIENT_ID"
              GOOGLE_CLIENT_SECRET: "$GOOGLE_OAUTH_CLIENT_SECRET"
              GOOGLE_REFRESH_TOKEN: "$GOOGLE_OAUTH_REFRESH_TOKEN"
          google-calendar:
            args:
              - "-y"
              - "@gongrzhe/server-googlecalendar-autoauth-mcp"
            command: "npx"
            env:
              GOOGLE_CLIENT_ID: "$GOOGLE_OAUTH_CLIENT_ID"
              GOOGLE_CLIENT_SECRET: "$GOOGLE_OAUTH_CLIENT_SECRET"
              GOOGLE_REFRESH_TOKEN: "$GOOGLE_OAUTH_REFRESH_TOKEN"
        model: "claude-sonnet-4-6"
      type: "claude_local"
    runtime:
      heartbeat:
        cron: "0 8 * * *"
        enabled: true
    budgetMonthlyCents: 1000

  chris-copypaste:
    role: "engineer"
    icon: "code"
    capabilities: "Engineering leadership, technical delivery, CCP execution via Claude Code"
