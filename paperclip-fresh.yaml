# ============================================================================
# ROUTINES
# ============================================================================

routines:
  # GHL write-back for Kristin's email marketing (reduced from every 30 min to hourly)
  ghl-write-back-sync:
    concurrencyPolicy: "skip_if_active"
    triggers:
      - kind: "schedule"
        cronExpression: "0 * * * *"
        timezone: "America/Chicago"

  # Lead fit score monthly recalculation
  lead-fit-score-monthly-update:
    priority: "high"
    triggers:
      - kind: "schedule"
        cronExpression: "0 9 1 * *"
        label: "Monthly on the 1st at 9am CT"
        timezone: "America/Chicago"

